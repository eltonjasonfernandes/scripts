 contoso
Environment:
·	AWS EKS in us-east-1, Dev environment
·	Multi-AZ deployment (2 AZs, same region)
·	Medium HA configuration
·	xcom recommends: 6 nodes × r5.8xlarge (32 vCPU, 256 GiB RAM per node)
Networking:
·	NGINX Ingress Controller (pre-installed)
·	Network flow: NLB (public) → ALB (private) → NGINX Ingress
·	DNS entries in Route53 (*.contoso.net hostnames)
·	NetworkPolicies enabled (allow-all policy required)
Security:
·	Pod Security Standard: restricted
·	No policy enforcement tools (OPA Gatekeeper, Kyverno, etc.)
·	Self-signed certificates for operator webhook
·	Enterprise PKI certificates for ingress TLS
RBAC:
·	Namespace-scoped deployment in <target-namespace> namespace
·	Admin installs the IAXPlatform CRD and ValidatingWebhookConfiguration (one-time, cluster-level; the CRD defines namespace-scoped resources, the VWC validates resources in specified namespaces)
·	Installer has permissions to create ServiceAccounts, Roles, RoleBindings with escalate and bind verbs
Registry:
·	Artifactory (air-gapped)
·	All images pre-pushed before installation
Storage:
·	gp3 is the default StorageClass for the cluster
Cluster Constraints:
·	No service mesh expected; Calico/Cilium only if NetworkPolicies are enabled later
·	No pod-limits or ulimit constraints are currently imposed
Availability Expectations:
·	DEV: Acceptable to experience short delays if a node fails; ingestion should remain consistent
·	UAT/PROD: Expectation of zero user-visible downtime and an SLA of 2–4 hours recovery for major issues
Scope:
·	This document covers initial installation only
·	Future integrations (SSO, external secrets manager) are not covered

Prerequisites
1. Kubernetes Cluster
·	AWS EKS cluster version 1.32
·	Multi-AZ deployment in us-east-1
·	Target namespace: <target-namespace>
Resource Requirements (from xcom Analytics Sizer):
·	Minimum: 59.18 cores and 219.11 GiB
·	Recommended: 170.55 cores and 317.84 GiB
xcom Recommendation: 6 worker nodes × r5.8xlarge (32 vCPU, 256 GiB RAM per node)
Node Layout for Medium HA:
·	3 nodes dedicated to TimescaleDB (labeled instancegroup=timescale-nodes)
·	3 nodes for all other platform components
·	Each node: r5.8xlarge (32 vCPU, 256 GiB RAM)
This is based on the output of the xcom Analytics Sizer for Medium HA configuration. The Medium HA configuration requires TimescaleDB to run on dedicated nodes for optimal performance (see section 6 for node labeling/tainting setup).
The <target-namespace> namespace must exist before installation.
2. Required Access
Admin (for Phase 1 & 2):
·	Permissions to create the IAXPlatform CRD and ValidatingWebhookConfiguration (cluster-level)
·	Permissions to create NetworkPolicies in target namespace
Installer (for Phase 3, 4 & 5):
·	Permissions to create Deployments, Services, ConfigMaps, Secrets in target namespace
·	Permissions to create/manage IAXPlatform custom resources
·	Permissions to create ServiceAccounts, Roles, RoleBindings (with escalate and bind verbs)
2.1 support-bundle kubectl Plugin (Required for Phase 6)
The support bundle collection commands in this guide use the kubectl support-bundle plugin.
Official source:
·	GitHub releases: https://github.com/replicatedhq/troubleshoot/releases
Install the plugin on the machine where you run kubectl:
Linux (x86_64):
SB_VERSION="v0.120.3"
curl -L "https://github.com/replicatedhq/troubleshoot/releases/download/${SB_VERSION}/troubleshoot_${SB_VERSION#v}_linux_amd64.tar.gz" -o troubleshoot.tar.gz
tar -xzf troubleshoot.tar.gz
chmod +x support-bundle
sudo mv support-bundle /usr/local/bin/kubectl-support_bundle

macOS (arm64 / Apple Silicon):
SB_VERSION="v0.120.3"
curl -L "https://github.com/replicatedhq/troubleshoot/releases/download/${SB_VERSION}/troubleshoot_${SB_VERSION#v}_darwin_arm64.tar.gz" -o troubleshoot.tar.gz
tar -xzf troubleshoot.tar.gz
chmod +x support-bundle
sudo mv support-bundle /usr/local/bin/kubectl-support_bundle

macOS (Intel x86_64):
SB_VERSION="v0.120.3"
curl -L "https://github.com/replicatedhq/troubleshoot/releases/download/${SB_VERSION}/troubleshoot_${SB_VERSION#v}_darwin_amd64.tar.gz" -o troubleshoot.tar.gz
tar -xzf troubleshoot.tar.gz
chmod +x support-bundle
sudo mv support-bundle /usr/local/bin/kubectl-support_bundle

Verify installation:
kubectl support-bundle version

If kubectl cannot find the plugin, ensure /usr/local/bin is in your PATH.
3. Helm Charts
Downloading Charts from x Registry
Before installation, download all required Helm charts from the x OCI registry.
Registry Credentials: Your xcom account manager will provide your registry username and password. These credentials are separate from your image registry credentials.
Download all required charts:
# Set your x registry credentials
export REGISTRY_USERNAME="your-username@example.com"
export REGISTRY_PASSWORD="your-password"
export CHARTS_DIR="./charts"
export VERSION="2.17.3"

# Create charts directory
mkdir -p $CHARTS_DIR

# Login to x registry
helm registry login registry.xcomgroup.com \
  --username $REGISTRY_USERNAME \
  --password $REGISTRY_PASSWORD

# Download all required charts
helm pull oci://registry.xcomgroup.com/xx/iax-operator-crd --version $VERSION -d $CHARTS_DIR && \
helm pull oci://registry.xcomgroup.com/xx/iax-operator-namespaced --version $VERSION -d $CHARTS_DIR && \
helm pull oci://registry.xcomgroup.com/xx/iax --version $VERSION -d $CHARTS_DIR && \
helm pull oci://registry.xcomgroup.com/xx/iax-app-webconsole --version $VERSION -d $CHARTS_DIR && \
helm pull oci://registry.xcomgroup.com/xx/iax-app-query-service --version $VERSION -d $CHARTS_DIR && \
helm pull oci://registry.xcomgroup.com/xx/iax-app-entities --version $VERSION -d $CHARTS_DIR && \
