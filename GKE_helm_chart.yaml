4. Image Registry Access (Air-gapped)
All required container images must be pushed to Artifactory before installation:
Registry URL: containerregistry-na.contosohase.net/container-external/proxy.xcomgroup.com/proxy/xx/docker.xcomgroup.com

Repository: obcerv

Pull Secret Name: artifactory-pull-secret
Ensure your namespace has pull access to the Artifactory registry. The pull secret must be created before installation:
kubectl create secret docker-registry artifactory-pull-secret \
  --docker-server=containerregistry-na.contosohase.net \
