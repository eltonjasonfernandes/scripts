Phase 6: Support Bundle Collection Setup
Overview
The iax-installation-support Helm chart provides support bundle and preflight check configurations for troubleshooting and diagnostics. This chart creates:
·	ConfigMaps with support bundle specifications defining what data to collect
·	ServiceAccount with RBAC for diagnostic collectors (nodes-resources, kubectl-top, etc.)
·	Preflight checks for validating cluster configuration
Installation
Install with namespace-scoped RBAC to match your deployment model:
helm install iax-support ./iax-installation-support-2.17.3.tgz \
  --namespace <target-namespace> \
  --set iax-troubleshoot.rbac.scope=namespace \
  --set iax-troubleshoot.image.registry=containerregistry-na.contosohase.net/container-external/proxy.xcomgroup.com/proxy/xx/docker.xcomgroup.com \
  --set iax-troubleshoot.image.repository=obcerv/replicated-tools \
  --set iax-troubleshoot.image.pullSecrets[0]=artifactory-pull-secret \
  --set iax-troubleshoot.platformTools.image.registry=containerregistry-na.contosohase.net/container-external/proxy.xcomgroup.com/proxy/xx/docker.xcomgroup.com \
  --set iax-troubleshoot.platformTools.image.repository=obcerv/platform-tools

Collecting Support Bundles
Once the chart is installed, users can collect support bundles:
kubectl support-bundle --load-cluster-specs -n <target-namespace>

This will generate a tarball (e.g., support-bundle-YYYY-MM-DDTHH_MM_SS.tar.gz) containing:
·	Pod logs from all platform components
·	Namespace resources (deployments, services, configmaps, etc.)
·	Diagnostic data from collector pods (resource usage, storage checks, etc.)
·	Helm release information
What is NOT collected (namespace-scoped installation):
·	Cluster-level resources (nodes, storage classes, etc.)
·	Resources from other namespaces

Verification
Step 1: Check Platform Status
kubectl get iaxplatform iax -n <target-namespace>

Should show:
NAME   AGE
iax    15m

To verify the platform is deployed:
kubectl get iaxplatform iax -n <target-namespace> -o jsonpath='{.status.status}'

Should return: DEPLOYED
Step 2: Check All Pods Running
kubectl get pods -n <target-namespace>

All pods should be in Running state with appropriate number of replicas ready (e.g., 2/2, 1/1, etc.).
To check for any pods not running:
kubectl get pods -n <target-namespace> --field-selector=status.phase!=Running

This should return no results (or only completed jobs).
Step 3: Check Ingress
kubectl get ingress -n <target-namespace>

You should see at minimum (for core apps):
·	iax-apps-ingress
·	iax-ingestion-ingress
·	iax-app-wc-ingress (Web Console)
·	iax-app-qs-ingress (Query Service)
·	iax-app-entities-ingress (Entities)
·	iax-app-commands-ingress (Commands)
·	iax-app-iam-ingress (IAM)
·	iax-app-ingestion-ingress (Ingestion)
And if additional apps are installed:
·	iax-app-alerting-ingress (Alerting)
·	iax-app-api-gateway-ingress (API Gateway)
·	iax-app-notifications-ingress (Notifications)
·	iax-app-dashboard-ingress (Dashboard)
·	iax-app-audit-ingress (Audit)
·	iax-app-traces-ingress (Traces)
·	iax-app-signal-forecaster-ingress (Signal Forecaster)
·	iax-app-capacity-planner-ingress (Capacity Planner)
·	iax-app-capacity-ingress (Capacity)
·	iax-app-centralised-config-ingress (Centralised Config)
·	iax-app-fixmonitor-ingress (FIX Monitor)
·	iax-app-signal-generator-ingress (Signal Generator)
Step 4: Get Initial Credentials
# Get password for 'admin' user
kubectl get secret iam-initial-credentials -n <target-namespace> \
  -o jsonpath='{.data.obcerv-admin}' | base64 -d && echo

# Get password for 'xcom' user  
kubectl get secret iam-initial-credentials -n <target-namespace> \
  -o jsonpath='{.data.obcerv-xcom}' | base64 -d && echo

Step 5: Access Web UI
Navigate to https://iax-apps.contoso.net (your configured hostname) and log in with:
·	Username: admin
·	Password: (from Step 4 - obcerv-admin secret key)
Step 6: Verify Storage Classes
# Check TimescaleDB PVCs
kubectl get pvc -n <target-namespace> | grep timescale

Step 7: Check Application Deployment
# Check all application pods are running
kubectl get pods -n <target-namespace> -l app.kubernetes.io/managed-by=Helm

All application pods should be in Running state.

