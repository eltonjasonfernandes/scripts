IAX Installation Guide for contoso
Version: 2.17.3/6

Target Environment: AWS EKS (Air-gapped)

Table of Contents
1.	Overview
2.	Prerequisites
3.	Phase 1: Admin Setup (One-Time)
4.	Phase 2: CRD and Webhook Installation (One-Time)
5.	Phase 3: Operator Installation
6.	Phase 4: IAX Platform Installation
